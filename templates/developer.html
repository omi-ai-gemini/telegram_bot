<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台管理系統 - 質感進化版</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .background-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* 套用你的書櫃背景圖 */
      background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920'); 
      background-size: cover;         
      background-position: center;     
      background-repeat: no-repeat;    
    }

    /* 玻璃卡片：增加一點點白色質感 */
    .glass-card {
      width: 100%;
      max-width: 480px; 
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(25px) saturate(180%);            
      -webkit-backdrop-filter: blur(25px) saturate(180%);    
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 32px;
      padding: 40px 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .admin-title {
      color: #000; 
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 35px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 20px; 
    }

    /* 按鈕優化：改為 Flex 垂直置中排列 */
    .shortcut-btn {
      background: rgba(255, 255, 255, 0.35); 
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px; /* 更圓潤的 Squircle */
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;  /* 水平居中 */
      justify-content: center; /* 垂直居中 */
      height: 130px; /* 稍微加高讓比例更協調 */
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    /* 增加紫色圖示的大小與發光感 */
    .btn-icon {
      color: #6d28d9; /* 稍微深一點的質感紫 */
      font-size: 38px; /* 放大圖示成為焦點 */
      margin-bottom: 12px;
      filter: drop-shadow(0 0 8px rgba(109, 40, 217, 0.3)); /* 紫色發光 */
      transition: transform 0.4s ease;
    }

    /* 黑色文字優化 */
    .btn-text {
      color: #000; 
      font-size: 15px;
      font-weight: 700; /* 更加粗一點 */
      letter-spacing: 0.5px;
    }

    /* 滑鼠懸停：亮度與縮放變化 */
    .shortcut-btn:hover {
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .shortcut-btn:hover .btn-icon {
      transform: scale(1.15) rotate(-3deg);
    }

    .shortcut-btn:active {
      transform: scale(0.94);
    }

    /* 登出按鈕：紅色發光感 */
    .logout-btn .btn-icon {
      color: #e11d48; /* 玫瑰紅 */
      filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.3));
    }
    
    .logout-btn:hover {
      background: rgba(255, 225, 225, 0.5);
    }

    /* 微小的按鈕內裝飾，增加精緻度 */
    .shortcut-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .shortcut-btn:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="background-container">
    <div class="glass-card">
      <h1 class="admin-title">後台管理</h1>
      
      <div class="shortcut-grid">
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-robot btn-icon"></i>
          <span class="btn-text">botID 查詢</span> 
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-brands fa-android btn-icon"></i>
          <span class="btn-text">botID 修改</span>
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-user-gear btn-icon"></i>
          <span class="btn-text">userID 查詢</span>
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-user-pen btn-icon"></i>
          <span class="btn-text">userID 修改</span>
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-brain btn-icon"></i>
          <span class="btn-text">memory 查詢</span>
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-sliders btn-icon"></i>
          <span class="btn-text">memory 修改</span>
        </button>
        
        <button class="shortcut-btn">
          <i class="fa-solid fa-book-open btn-icon"></i>
          <span class="btn-text">操作說明</span>
        </button>
        
        <button class="shortcut-btn logout-btn">
          <i class="fa-solid fa-right-from-bracket btn-icon"></i>
          <span class="btn-text">後台登出</span>
        </button>
        
      </div>
    </div>
  </div>

</body>
</html>
