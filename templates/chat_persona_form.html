<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>聊天人物設定</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    .page {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
    }

    .desc {
      margin: 0 0 24px 0;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.72);
    }

    .note {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #bfdbfe;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
    }

    .section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.86);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    select {
      color-scheme: dark;
    }

    select option {
      background: #0f172a;
      color: #ffffff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(96, 165, 250, 0.9);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.6;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.48);
    }

    .button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .button:active {
      transform: scale(0.98);
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.28);
      color: #bbf7d0;
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #fecaca;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">

      <h1>👤 聊天人物設定</h1>

      <p class="desc">
        這裡是聊天模式使用的人物設定。
        可以設定 bot 在一般聊天時扮演的人物，不填也可以。
      </p>

      <div class="note">
        這份表單沒有必填欄位；如果有填，聊天模式會套用這些人物設定。
      </div>

      <form id="chat-persona-form">

        <input type="hidden" name="bot_id" value="{{ bot_id }}">
        <input type="hidden" name="chat_id" value="{{ chat_id }}">
        <input type="hidden" name="user_id" value="{{ user_id }}">

        <div class="section">
          <div class="section-title">聊天人物</div>

          <div class="field">
            <label for="persona_name">人物姓名</label>
            <input
              id="persona_name"
              name="persona_name"
              type="text"
              value="{{ settings.persona_name }}"
              placeholder="例如：小澪、阿祐、銀優..."
            >
          </div>

          <div class="field">
            <label for="persona_gender">人物性別</label>
            <select id="persona_gender" name="persona_gender">
              <option value="" {% if settings.persona_gender == "" %}selected{% endif %}>不指定</option>
              <option value="女性" {% if settings.persona_gender == "女性" %}selected{% endif %}>女性</option>
              <option value="男性" {% if settings.persona_gender == "男性" %}selected{% endif %}>男性</option>
              <option value="其他" {% if settings.persona_gender == "其他" %}selected{% endif %}>其他</option>
            </select>
          </div>

          <div class="field">
            <label for="persona_background">人物背景</label>
            <textarea
              id="persona_background"
              name="persona_background"
              placeholder="描述這個人物的身份、性格、說話感覺、和使用者的關係..."
            >{{ settings.persona_background }}</textarea>
            <div class="hint">聊天模式會參考這裡，但不會像劇本模式那樣強制演劇情。</div>
          </div>
        </div>

        <button id="submit-btn" type="submit" class="button">確認儲存</button>

        <div id="status" class="status"></div>

      </form>

    </div>
  </div>

  <script>
    const form = document.getElementById("chat-persona-form");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function showStatus(type, message) {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "儲存中...";

      const formData = new FormData(form);

      try {
        const response = await fetch("/setting/chat_persona/save", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.ok) {
          showStatus("success", result.message || "聊天人物設定已儲存，可以關閉此頁。");
          submitBtn.textContent = "已儲存";
        } else {
          showStatus("error", result.message || "儲存失敗，請檢查欄位。");
          submitBtn.disabled = false;
          submitBtn.textContent = "確認儲存";
        }

      } catch (error) {
        console.error(error);
        showStatus("error", "無法連線到伺服器，請稍後再試。");
        submitBtn.disabled = false;
        submitBtn.textContent = "確認儲存";
      }
    });
  </script>
</body>
</html>
