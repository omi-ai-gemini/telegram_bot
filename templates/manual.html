<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大師級 100% 究極消融與無限滑動控制台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ══════════════════════════════════════════
       1. 全域重設與大師指定草地貓咪背景
       ══════════════════════════════════════════ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      
      background-image: url('https://unsplash.com/photos/ECfPmkOVZPA/download?force=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 40px 20px;
    }

    /* 全域過渡：用於彩蛋觸發時整套卡片一起優雅淡出/淡入 */
    .notebook-container {
      display: flex;
      width: 950px;
      max-width: 100%;

      /* 🌟 把原本的 height: 550px; 換成下面這兩行： */
      min-height: 550px; /* 確保內容少的時候，大卡片還是維持大氣的基本高度 */
      height: auto;      /* 核心解封：讓卡片隨著內文加長，自動往下無限延伸！ */

      align-items: stretch;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    /* 當啟動「完美視覺」彩蛋時，整體卡片下一秒瞬間隱形 */
    .notebook-container.perfect-visual-mode {
      opacity: 0 !important;
      pointer-events: none; 
    }

    /* ══════════════════════════════════════════
       2. 【電腦版】左側標籤欄（形狀鎖定 + 滾輪隱藏）
       ══════════════════════════════════════════ */
    .tab-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0 !important;             
      position: relative;
      margin-right: -1px !important; 
      z-index: 2;                    
      
      height: 550px;
      overflow-y: auto;
      scrollbar-width: none; 
      flex-shrink: 0;
      cursor: pointer; 
      user-select: none; 

      /* 🌟 核心修正：由側邊欄容器本身來扛住「左上」與「左下」的 24px 圓角 */
      border-radius: 24px 0 0 24px;
    }
    .tab-sidebar::-webkit-scrollbar {
      display: none; 
    }

    /* 所有的標籤卡：高度為 110px，拿掉干擾滾動的個別圓角 */
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 95px;
      height: 110px; 
      flex-shrink: 0; 
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75); 
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: none; 
      border-radius: 0 !important; /* 🌟 徹底清除標籤個別圓角，避免滾動時鋸齒外溢 */
    }

    /* 找到手機版媒體查詢裡的這一段，直接替換覆蓋掉： */
    .tab-sidebar .tab-item:last-child {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: none !important; /* 🌟 核心修正：強迫拔除殘留底線，把這個檻徹底剷平！ */
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* 當標籤卡被點擊 (Active)：右邊線蒸發，融為一體！ */
    .tab-item.active {
      color: #1d4ed8; 
      background: rgba(255, 255, 255, 0.28) !important; 
      border-right-color: transparent !important; 
      box-shadow: -6px 4px 15px rgba(0, 0, 0, 0.05);
    }

    .tab-item i {
      font-size: 22px;
      margin-bottom: 8px;
    }

    /* ══════════════════════════════════════════
       3. 【電腦版】右側內容卡（右側對稱圓角優化）
       ══════════════════════════════════════════ */
    .content-card {
      flex: 1;
      padding: 45px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      
      border-left: none !important; 
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);

      /* 🌟 核心修正：與左側欄完美呼應，鎖定「右上」與「右下」的 24px 圓角 */
      border-radius: 0 24px 24px 0 !important;
    }

    .tab-content h2 {
      font-size: 26px;
      color: #0f172a;
      margin-bottom: 15px;
      border-left: 5px solid #1d4ed8;
      padding-left: 14px;
    }

    .tab-content p {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      margin-bottom: 25px;
    }

    .metrics-box {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 16px;
    }

    .metrics-box h3 {
      font-size: 16px;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .metrics-box ul { list-style: none; }
    .metrics-box li {
      margin-bottom: 10px;
      font-size: 14px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .metrics-box li i { color: #1d4ed8; }

    /* ══════════════════════════════════════════
       4. 📱 手機版完美圓角變形策略
       ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      body {
        align-items: flex-start !important; 
        padding: 50px 16px !important;      
      }

      .notebook-container {
        flex-direction: column; 
        width: 100%;
        height: auto;            
      }

      /* 手機版頂部標籤列：改為橫向排列 */
      .tab-sidebar {
        flex-direction: row;
        margin-right: 0 !important;
        margin-bottom: -1px !important; 
        width: 100%;
        height: auto;
        overflow-x: auto;          
        overflow-y: hidden;        
        -webkit-overflow-scrolling: touch; 

        /* 🌟 手機版核心修正：容器切換為「左上」與「右上」圓角 */
        border-radius: 24px 24px 0 0 !important;
      }

      /* 手機版標籤卡：寬度平分 20% */
      .tab-item {
        flex: 0 0 20% !important;  
        height: 75px;
        width: auto;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-right: none; 
        border-bottom: none; 
      }
      
      .tab-sidebar .tab-item:last-child {
        border-right: 1px solid rgba(255, 255, 255, 0.25);
      }

      .tab-item i { font-size: 18px; margin-bottom: 4px; }
      .tab-item br { display: none; }
      .tab-item span { font-size: 11px; margin-left: 2px; }

      /* 手機版動態消融：轉化為「底邊線」蒸發 */
      .tab-item.active {
        border-right-color: rgba(255, 255, 255, 0.25) !important; 
        border-bottom-color: transparent !important; 
      }

      /* 手機版內容卡 */
      .content-card {
        border-left: 1px solid rgba(255, 255, 255, 0.25) !important; 
        border-top: none !important; 
        padding: 35px 20px;

        /* 🌟 手機版核心修正：內容卡切換為「左下」與「右下」圓角，完美包覆 */
        border-radius: 0 0 24px 24px !important;
      }
    }
    
    /* 💖 隱藏彩蛋：IG 風格點讚愛心（完美起飛版） */
    .like-heart {
      position: fixed;
      color: #ff3040;
      font-size: 4rem;
      transform: translate(-50%,-50%) scale(0);
      pointer-events: none;
      z-index: 9999;
      filter: drop-shadow(0 0 15px rgba(255,48,64,0.6));
      animation: heartBurst 0.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
    }

    @keyframes heartBurst {
      0% {
        transform: translate(-50%,-50%) scale(0);
        opacity: 1;
      }
      15% {
        transform: translate(-50%,-50%) scale(1.2);
      }
      30% {
        transform: translate(-50%,-50%) scale(1);
      }
      100% {
        transform: translate(-50%,-150px) scale(0.8);
        opacity: 0;
      }
    }
    
    /* 📱 大師級卡片手機版優化：動態換行與精準縮排 */
    .metric-item {
      margin-bottom: 16px; /* 每個項目的上下間距 */
    }

    .metric-title {
      display: block; /* 🌟 強制小標題自己站一行 */
      font-weight: bold;
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 6px; /* 小標題與下方內文的微小間距 */
    }

    .metric-title i {
      margin-right: 6px; /* 圖標與文字的精緻微距 */
      color: #4a90e2; /* 圖標顏色，可依您的設計自行調整 */
    }

    .metric-desc {
      display: block;
      padding-left: 28px; /* 🌟 核心魔法：這裡控制內文的開頭縮排，完美對齊圖標後方的寬度！ */
      font-size: 0.95rem;
      line-height: 1.6; /* 讓文字有些微呼吸空間，不擁擠 */
      color: #555;
    }
    
    /* 🤖 下方設定流程區塊的優雅留白 */
    .setup-step-box {
      margin-top: 24px; /* 🌟 讓它跟上方的大師級卡片保持完美的呼吸間距 */
      padding: 0 8px;   /* 讓兩側稍微縮進去一點，視覺更精緻 */
    }

    /* 順便幫接通大模型的圖標換上您剛問的 AI 魔法火花色 ✨ */
    .setup-step-box .fa-wand-magic-sparkles {
      color: #a855f7; /* 浪漫的 AI 智慧紫 */
    }
    
    /* 🖤 大師專屬：超自由自訂文字區塊 */
    .master-text {
      font-size: 1.25rem;       /* 🌟 精準設定：比 desc 大，比 title 小 */
      color: #000000;          /* 🌟 絕對純黑 */
      font-weight: 600;        /* 讓字體帶點厚度，非常有質感 */
      line-height: 1.7;        /* 舒適的行高，打多行字也不會擠 */

      /* 📐 間距自由調整區（可以直接改下面這兩個數字） */
      margin-top: 5px;        /* 與上方元素的間距 */
      margin-bottom: 5px;     /* 與下方元素的間距 */
    }
    
    /* 🖤 大師專屬：高質感互動輸入框 */
    .master-input-group {
      margin-top: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px; /* 標籤與輸入框的精緻間距 */
    }

    /* 輸入框上方的標題文字 */
    .master-input-group label {
      font-size: 0.95rem;
      color: #333;
      font-weight: 600;
    }

    .master-input-group label i {
      color: #4a90e2; /* 延續大師的科技藍圖標色 */
      margin-right: 6px;
    }

    /* 輸入框本體 */
    .master-input {
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px; /* Apple 風格的黃金圓角 */
      outline: none;
      background: #f9f9f9;
      color: #333;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* 超滑順動畫 */
    }

    /* 🌟 核心靈魂：當使用者點擊輸入框時的魔法發光效果 */
    .master-input:focus {
      border-color: #a855f7; /* 浪漫的 AI 智慧紫 */
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15); /* 外圍優雅的光暈 */
    }
    
    /* 💾 大師特調：互動控制按鈕 */
    .master-action-btn {
      display: block;           /* 🌟 核心：確保是區塊元素 */
      width: 240px;             /* 🌟 核心：把原本的 100% 刪掉，改成您想要的精緻寬度（可自由調整數字） */
      margin: 10px auto 25px auto; /* 🌟 核心：左右設為 auto，按鈕就會啪一聲絕對置中！ */

      /* 以下原本的精美樣式保持不變 */
      padding: 14px;
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
    }

    .master-action-btn:hover {
      transform: translateY(-2px); /* 輕微懸浮感 */
      box-shadow: 0 6px 18px rgba(74, 144, 226, 0.3);
    }

    .master-action-btn:active {
      transform: translateY(1px); /* 點擊壓下感 */
    }

    /* 🌟 當完成設定時的成功樣式（優雅綠） */
    .master-action-btn.success {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%) !important;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2) !important;
      cursor: default;
      transform: none !important;
    }
    
    /* 🎯 幫您的描述文字加上這行魔法，它才會理會 \n 的換行指令！ */
    .card-desc, .desc, p { 
      white-space: pre-wrap !important; 
    }
    
    /* 🎯 貼在您 CSS 欄位的最底部（第 255 行之後） */

    /* 1. 幫您的手機版內容卡解鎖 iPad 捲軸功能 */
    .content-card {
      height: 480px !important;     /* 🌟 鎖死高度（高度您可以看畫面自由調整數字） */
      overflow-y: auto !important;  /* 🌟 超出高度時，自動啟用上下捲軸 */
      overflow-x: hidden !important;/* 🌟 鎖死左右滑動，絕對防跑版 */
    }

    /* 2. 暗黑系極簡捲軸美化（讓捲軸變透明銀白，完美融入您的暗色主題） */
    .content-card::-webkit-scrollbar {
      width: 6px; /* 纖細科技感 */
    }

    .content-card::-webkit-scrollbar-track {
      background: transparent; /* 軌道隱形 */
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .content-card::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2); /* 半透明銀白 */
      border-radius: 10px;
    }

    .content-card::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4); /* 滑鼠游標移過去時變亮 */
    }
    
    /* 電腦與手機一起套用 */
    .pc-card, .content-card {
      height: 480px !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }
    
    /* 🎯 請貼在您 CSS 欄位的最底部 */

    .content-card {
      height: 550px !important;     /* 🌟 大幅拔高！給按鈕和內容完美的伸展台，不再被剪短 */
      overflow-y: auto !important;  /* 🌟 核心：內容如果真的超過 620px，就會在卡片內上下捲動 */
      overflow-x: hidden !important;/* 🌟 鎖死左右，防跑版 */
    }

    /* 🎯 順便把剛剛迷路的換行魔法，安安全全地放回 CSS 欄位 */
    .card-desc, .desc, p { 
      white-space: pre-wrap !important; 
    }
    
    /* 📸 大師特調：操作指引圖片優化 */
    .guide-img {
      width: 100%;             /* 🌟 核心：寬度自動填滿卡片內部，絕不超出邊框 */
      max-width: 100%;         /* 強制鎖死最大寬度，防跑版 */
      height: auto;            /* 🌟 核心：高度依比例自動縮放，圖片絕對不變形 */
      border-radius: 12px;     /* 加上漂亮的圓角，呼應您的 iPad 風格 */
      border: 1px solid rgba(255, 255, 255, 0.1); /* 隱隱約約的科技感邊框 */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);   /* 給圖片一點立體陰影，質感大加分 */
      margin: 15px 0 20px 0;   /* 上下留點呼吸空間，不要跟文字或輸入框擠在一起 */
      display: block;          /* 確保圖片獨立一行 */
    }
  </style>
</head>
<body>

  <div class="notebook-container" id="mainContainer">
    
    <div class="tab-sidebar" id="tabSidebar">
      <div class="tab-item active" data-target="b1">
        <i class="fa-solid fa-fingerprint"></i>
        <span>標籤<br>操作</span>
      </div>
      <div class="tab-item" data-target="b2">
        <i class="fa-solid fa-robot"></i>
        <span>取得<br>bot</span>
      </div>
      <div class="tab-item" data-target="b3">
        <i class="fa-solid fa-atom"></i>
        <span>取得<br>AI</span>
      </div>
      <div class="tab-item" data-target="b7">
        <i class="fa-solid fa-wifi"></i>
        <span>建立<br>telemini</span>
      </div>
      <div class="tab-item" data-target="b4">
        <i class="fa-solid fa-user-gear"></i>
        <span>人物<br>設定</span>
      </div>
      <div class="tab-item" data-target="b5">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>關於<br>系統</span>
      </div>
      <div class="tab-item" data-target="b6">
        <i class="fa-solid fa-database"></i>
        <span>關於<br>資料庫</span>
      </div>
      <div class="tab-item" data-target="visual">
        <i class="fa-solid fa-cat"></i>
        <span>完美<br>視覺</span>
      </div>
    </div>

    <div class="content-card">
      <div class="tab-content">
        <h2 id="cardTitle">網頁標籤卡控制教學</h2>
        <p id="cardDesc">為什麼要寫這個? 因為我覺得我做得很漂亮</p>
        <div class="metrics-box">
            <h3>🧭 大師級 Carousel 標籤控制指南：</h3>
            
            <div class="metric-item">
              <div class="metric-title"><i class="fa-solid fa-fingerprint"></i> 用你的手指</div>
              <div class="metric-desc">放在上方標籤欄<strong>向左橫滑</strong>這會讓它看起來很厲害！</div>
            </div>
            
            <div class="metric-item">
              <div class="metric-title"><i class="fa-solid fa-eye"></i> 完美視覺</div>
              <div class="metric-desc">我讓Gemini參考Apple的黃金弧度做成四個角的圓弧，但我不知道它有沒有聽懂。</div>
            </div>
        </div>  
    </div>
  </div>

  <script>
    const tabItems = document.querySelectorAll('.tab-item');
    const mainContainer = document.getElementById('mainContainer');
    const sidebar = document.getElementById('tabSidebar');
    const titleElement = document.getElementById('cardTitle');
    const descElement = document.getElementById('cardDesc');
    
    let lastActiveTab = document.querySelector('.tab-item.active');

    const contentData = {
      b1: {
        title: "網頁標籤卡控制教學",
        desc: "為什麼要寫這個? 因為我覺得我做得很漂亮",
        // 🌟 這裡升級為大師級響應式結構
        extra: `

            <div class="metrics-box">
                <h3>🧭 大師級 Carousel 標籤控制指南：</h3>
                
                <div class="metric-item">
                <div class="metric-title"><i class="fa-solid fa-fingerprint"></i> 用你的手指</div>
                <div class="metric-desc">放在上方標籤欄<strong>向左橫滑</strong>這會讓它看起來很厲害！</div>
                </div>
                
                <div class="metric-item">
                <div class="metric-title"><i class="fa-solid fa-eye"></i> 完美視覺</div>
                <div class="metric-desc">我讓Gemini參考Apple的黃金弧度做成四個角的圓弧，但我不知道它有沒有聽懂。</div>
                </div>
            </div>  
        </div>`
      },
      b7: {

    // 💡 1. 處理標籤點擊與大師指定「下一秒隱身」彩蛋
        tabItems.forEach(item => {
          item.addEventListener('click', () => {
            const target = item.getAttribute('data-target');

            if (target === 'visual') {
              setTimeout(() => {
                mainContainer.classList.add('perfect-visual-mode');
                setTimeout(() => {
                  mainContainer.classList.remove('perfect-visual-mode');
                }, 3800);
              }, 100);
              return; 
            }

            tabItems.forEach(t => t.classList.remove('active'));
            item.classList.add('active');
            lastActiveTab = item; 

            // 🌟 覆蓋掉原本的 if (contentData[target]) { ... } 整個區塊
            if (contentData[target]) {
              titleElement.textContent = contentData[target].title;
              descElement.textContent = contentData[target].desc;

              // 🧹 終極無差別大掃除：一勞永逸解決無限複製問題！
              const tabContent = document.querySelector('.tab-content');
              // 把 tab-content 裡面的所有東西巡視一遍
              Array.from(tabContent.children).forEach(child => {
                // 只要它不是標題 (cardTitle)，也不是描述 (cardDesc)，就直接無情拔除！
                if (child.id !== 'cardTitle' && child.id !== 'cardDesc') {
                  child.remove();
                }
              });

              // 🔮 乾淨的畫布準備好後，才把新的 extra 長出來
              if (contentData[target].extra) {
                tabContent.insertAdjacentHTML('beforeend', contentData[target].extra);
              }
            } // 🌟 覆蓋到這個結束的大括號
          });
        });

    // 💡 2. 電腦版滑鼠拖拽捲動
    let isDown = false;
    let startY;
    let scrollTop;

    sidebar.addEventListener('mousedown', (e) => {
      isDown = true;
      sidebar.style.cursor = 'grabbing';
      startY = e.pageY - sidebar.offsetTop;
      scrollTop = sidebar.scrollTop;
    });

    sidebar.addEventListener('mouseleave', () => {
      isDown = false;
      sidebar.style.cursor = 'pointer';
    });

    sidebar.addEventListener('mouseup', () => {
      isDown = false;
      sidebar.style.cursor = 'pointer';
    });

    sidebar.addEventListener('mousemove', (e) => {
      if (!isDown) return; 
      e.preventDefault();   
      const y = e.pageY - sidebar.offsetTop;
      const walk = (y - startY) * 1.5; 
      sidebar.scrollTop = scrollTop - walk;
    });
    
    // 💖 彩蛋中的彩蛋：在完美視覺模式下，點擊背景出現 IG 愛心
    document.addEventListener('click', (e) => {
      // 只有當 mainContainer 身上有 'perfect-visual-mode' 這個 class 時才觸發
      if (mainContainer.classList.contains('perfect-visual-mode')) {

        // 1. 創造一個 <i> 標籤，並套用 Font Awesome 的愛心圖示
        const heart = document.createElement('i');
        heart.className = 'fa-solid fa-heart like-heart';

        // 2. 把愛心的位置設定在滑鼠/手指點擊的精準座標上
        heart.style.left = `${e.clientX}px`;
        heart.style.top = `${e.clientY}px`;

        // 3. 把愛心貼到網頁上
        document.body.appendChild(heart);

        // 4. 動畫播完後 (約 0.8 秒)，自動把愛心清掉，保持 HTML 乾淨！
        setTimeout(() => {
          heart.remove();
        }, 800);
      }
    });
    
    document.addEventListener('click', function(e) {

      // 📦 1. 處理 Webhook 按鈕點擊 (對應 /admin/manual/add_bot)
      if (e.target && e.target.id === 'webhook-btn') {
        const botIdInput = document.getElementById('bot-name'); // 抓取您 HTML 的 bot 欄位
        const tokenInput = document.getElementById('bot-token'); // 抓取您 HTML 的 token 欄位

        if (!botIdInput || !tokenInput) return;

        const botId = botIdInput.value.trim();
        const token = tokenInput.value.trim();

        if (botId === '' || token === '') {
          alert('⚠️ 「Bot」和「Token」兩個欄位都必須輸入喔！');
          return;
        }

        // 🌟 核心轉換：使用 FormData 來打包，這樣 Flask 的 request.form 才抓得到！
        const formData = new FormData();
        formData.append('bot_id', botId); // 名字必須跟 Flask 裡面的 request.form["bot_id"] 一模一樣
        formData.append('token', token);

        // 發送 POST 請求到您的 Flask 路由
        fetch('/admin/manual/add_bot', {
          method: 'POST',
          body: formData // 直接把表單塞進去，瀏覽器會自動處理 Content-Type
        })
        .then(response => response.text()) // 🌟 您的 Flask 是回傳純文字，所以這裡用 .text()
        .then(text => {
          // 判斷回傳的文字是否包含「成功」
          if(text.includes('成功')) {
            botIdInput.value = '';
            tokenInput.value = '';
            e.target.textContent = 'webhook設定完成';
            e.target.classList.add('success');
          } else {
            // 如果失敗（例如回傳了 res.text），就顯示出來讓大師除錯
            alert('後端回報：\n' + text);
          }
        })
        .catch(error => {
          console.error('連線錯誤:', error);
          alert('無法連線到伺服器！');
        });
      }

      // 🧠 2. 處理 AI 設定按鈕點擊 (對應 /admin/manual/add_key)
      if (e.target && e.target.id === 'ai-btn') {
        const userIdInput = document.getElementById('user-id');
        const geminiKeyInput = document.getElementById('gemini-key');

        if (!userIdInput || !geminiKeyInput) return;

        const userId = userIdInput.value.trim();
        const geminiKey = geminiKeyInput.value.trim();

        if (userId === '' || geminiKey === '') {
          alert('⚠️ 「User_id」和「Gemini api key」都必須輸入喔！');
          return;
        }

        // 🌟 打包成表單格式
        const formData = new FormData();
        formData.append('user_id', userId);
        formData.append('gemini_api_key', geminiKey); // 對應 request.form["gemini_api_key"]

        fetch('/admin/manual/add_key', {
          method: 'POST',
          body: formData
        })
        .then(response => response.text()) // 解析成純文字
        .then(text => {
          if(text.includes('成功')) {
            userIdInput.value = '';
            geminiKeyInput.value = '';
            e.target.textContent = 'AI設定完成';
            e.target.classList.add('success');
          } else {
            alert('後端回報：\n' + text);
          }
        })
        .catch(error => console.error('連線錯誤:', error));
      }
    });
  </script>
