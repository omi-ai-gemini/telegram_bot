<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手動的 - 大師級 100% 究極消融與無限滑動控制台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ══════════════════════════════════════════
       1. 全域重設與大師指定草地貓咪背景
       ══════════════════════════════════════════ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; 
      
      background-image: url('https://unsplash.com/photos/ECfPmkOVZPA/download?force=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 40px 20px;
    }

    /* 全域過渡：用於彩蛋觸發時整套卡片一起優雅淡出/淡入 */
    .notebook-container {
      display: flex;
      width: 950px;
      max-width: 100%;
      height: 550px;
      align-items: stretch;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    /* 當啟動「完美視覺」彩蛋時，整體卡片下一秒瞬間隱形 */
    .notebook-container.perfect-visual-mode {
      opacity: 0 !important;
      pointer-events: none; 
    }

    /* ══════════════════════════════════════════
       2. 【電腦版】左側標籤欄（形狀鎖定 + 滾輪隱藏）
       ══════════════════════════════════════════ */
    .tab-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0 !important;             
      position: relative;
      margin-right: -1px !important; 
      z-index: 2;                    
      
      height: 550px;
      overflow-y: auto;
      scrollbar-width: none; 
      flex-shrink: 0;
      cursor: pointer; 
      user-select: none; 

      /* 🌟 核心修正：由側邊欄容器本身來扛住「左上」與「左下」的 24px 圓角 */
      border-radius: 24px 0 0 24px;
    }
    .tab-sidebar::-webkit-scrollbar {
      display: none; 
    }

    /* 所有的標籤卡：高度為 110px，拿掉干擾滾動的個別圓角 */
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 95px;
      height: 110px; 
      flex-shrink: 0; 
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75); 
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: none; 
      border-radius: 0 !important; /* 🌟 徹底清除標籤個別圓角，避免滾動時鋸齒外溢 */
    }

    /* 找到手機版媒體查詢裡的這一段，直接替換覆蓋掉： */
    .tab-sidebar .tab-item:last-child {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: none !important; /* 🌟 核心修正：強迫拔除殘留底線，把這個檻徹底剷平！ */
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* 當標籤卡被點擊 (Active)：右邊線蒸發，融為一體！ */
    .tab-item.active {
      color: #1d4ed8; 
      background: rgba(255, 255, 255, 0.28) !important; 
      border-right-color: transparent !important; 
      box-shadow: -6px 4px 15px rgba(0, 0, 0, 0.05);
    }

    .tab-item i {
      font-size: 22px;
      margin-bottom: 8px;
    }

    /* ══════════════════════════════════════════
       3. 【電腦版】右側內容卡（右側對稱圓角優化）
       ══════════════════════════════════════════ */
    .content-card {
      flex: 1;
      padding: 45px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      
      border-left: none !important; 
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);

      /* 🌟 核心修正：與左側欄完美呼應，鎖定「右上」與「右下」的 24px 圓角 */
      border-radius: 0 24px 24px 0 !important;
    }

    .tab-content h2 {
      font-size: 26px;
      color: #0f172a;
      margin-bottom: 15px;
      border-left: 5px solid #1d4ed8;
      padding-left: 14px;
    }

    .tab-content p {
      font-size: 15px;
      line-height: 1.7;
      color: #1e293b;
      margin-bottom: 25px;
    }

    .metrics-box {
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 16px;
    }

    .metrics-box h3 {
      font-size: 16px;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .metrics-box ul { list-style: none; }
    .metrics-box li {
      margin-bottom: 10px;
      font-size: 14px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .metrics-box li i { color: #1d4ed8; }

    /* ══════════════════════════════════════════
       4. 📱 手機版完美圓角變形策略
       ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      body {
        align-items: flex-start !important; 
        padding: 50px 16px !important;      
      }

      .notebook-container {
        flex-direction: column; 
        width: 100%;
        height: auto;            
      }

      /* 手機版頂部標籤列：改為橫向排列 */
      .tab-sidebar {
        flex-direction: row;
        margin-right: 0 !important;
        margin-bottom: -1px !important; 
        width: 100%;
        height: auto;
        overflow-x: auto;          
        overflow-y: hidden;        
        -webkit-overflow-scrolling: touch; 

        /* 🌟 手機版核心修正：容器切換為「左上」與「右上」圓角 */
        border-radius: 24px 24px 0 0 !important;
      }

      /* 手機版標籤卡：寬度平分 20% */
      .tab-item {
        flex: 0 0 20% !important;  
        height: 75px;
        width: auto;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-right: none; 
        border-bottom: none; 
      }
      
      .tab-sidebar .tab-item:last-child {
        border-right: 1px solid rgba(255, 255, 255, 0.25);
      }

      .tab-item i { font-size: 18px; margin-bottom: 4px; }
      .tab-item br { display: none; }
      .tab-item span { font-size: 11px; margin-left: 2px; }

      /* 手機版動態消融：轉化為「底邊線」蒸發 */
      .tab-item.active {
        border-right-color: rgba(255, 255, 255, 0.25) !important; 
        border-bottom-color: transparent !important; 
      }

      /* 手機版內容卡 */
      .content-card {
        border-left: 1px solid rgba(255, 255, 255, 0.25) !important; 
        border-top: none !important; 
        padding: 35px 20px;

        /* 🌟 手機版核心修正：內容卡切換為「左下」與「右下」圓角，完美包覆 */
        border-radius: 0 0 24px 24px !important;
      }
    }
  </style>
</head>
<body>

  <div class="notebook-container" id="mainContainer">
    
    <div class="tab-sidebar" id="tabSidebar">
      <div class="tab-item active" data-target="base">
        <i class="fa-solid fa-house"></i>
        <span>基礎<br>操作</span>
      </div>
      <div class="tab-item" data-target="advanced">
        <i class="fa-solid fa-gear"></i>
        <span>進階<br>設定</span>
      </div>
      <div class="tab-item" data-target="data">
        <i class="fa-solid fa-chart-column"></i>
        <span>數據<br>分析</span>
      </div>
      <div class="tab-item" data-target="system">
        <i class="fa-solid fa-file-lines"></i>
        <span>系統<br>說明</span>
      </div>
      <div class="tab-item" data-target="test6">
        <i class="fa-solid fa-flask"></i>
        <span>測試<br>標籤六</span>
      </div>
      <div class="tab-item" data-target="test7">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>測試<br>標籤七</span>
      </div>
      <div class="tab-item" data-target="visual">
        <i class="fa-solid fa-eye"></i>
        <span>完美<br>視覺</span>
      </div>
    </div>

    <div class="content-card">
      <div class="tab-content">
        <h2 id="cardTitle">大師級動態消融控制台</h2>
        <p id="cardDesc">您的指導棋太精妙了！現在請任意點擊左側的標籤，JavaScript 會完美轉移選取狀態，讓點擊的標籤與內容卡完美融合，而其他標籤則會立刻浮現精準的隔離界線！</p>
        
        <div class="metrics-box">
          <h3>🧭 大師級 Carousel 標籤測試指南：</h3>
          <ul>
            <li><i class="fa-solid fa-mouse"></i> <strong>電腦網頁版</strong>：請把滑鼠移到左側標籤欄，<strong>按住滑鼠左鍵不放往上/下拖拽</strong>，隱藏的標籤就會完美滑出來！</li>
            <li><i class="fa-solid fa-fingerprint"></i> <strong>手機網頁版</strong>：用手指直接在上方標籤欄<strong>向左橫滑</strong>，畫面永遠優雅維持 5 個標籤！</li>
            <li><i class="fa-solid fa-eye"></i> <strong>完美視覺按鈕</strong>：點擊後文字不變，下一秒卡片通通消失 5 秒，純白字體絕不變色！</li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <script>
    const tabItems = document.querySelectorAll('.tab-item');
    const mainContainer = document.getElementById('mainContainer');
    const sidebar = document.getElementById('tabSidebar');
    const titleElement = document.getElementById('cardTitle');
    const descElement = document.getElementById('cardDesc');
    
    let lastActiveTab = document.querySelector('.tab-item.active');

    const contentData = {
      base: {
        title: "大師級動態消融控制台",
        desc: "您的指導棋太精妙了！現在請任意點擊左側的標籤，JavaScript 會完美轉移選取狀態，讓點擊的標籤與內容卡完美融合，而其他標籤則會立刻浮現精準的隔離界線！"
      },
      advanced: {
        title: "進階設定主面板",
        desc: "您已成功切換至進階設定！此時「進階設定」的邊線已經徹底蒸發，而原本的「基礎操作」則重新長回了界線，邏輯無懈可擊！"
      },
      data: {
        title: "核心數據分析中心",
        desc: "即時數據動態圖表已同步。透過大師提議的結構一致化設定，不論點擊哪一個標籤，切換過程都滑順如絲，完全沒有一絲抖動。"
      },
      system: {
        title: "系統架構說明文件",
        desc: "歡迎查閱系統配置。本介面不論在電腦的大型顯示器，或是切換到智慧型手機的窄螢幕上，都能夠自動適應並維持完美的玻璃同調消融美學。"
      },
      test6: {
        title: "測試功能模組 六",
        desc: "這是為了驗證大師「水平與垂直傳送帶標籤」靈感而誕生的第六個分頁！容器高度與寬度配比精密，滾動極致順暢！"
      },
      test7: {
        title: "測試功能模組 七",
        desc: "這是第七個標籤分頁內容！不論未來大師想要擴充到十個還是二十個標籤，這個滑動架構都能完美承載，無限延伸！"
      }
    };
    
    // 💡 1. 處理標籤點擊與大師指定「下一秒隱身」彩蛋
    tabItems.forEach(item => {
      item.addEventListener('click', () => {
        const target = item.getAttribute('data-target');
        
        if (target === 'visual') {
          setTimeout(() => {
            mainContainer.classList.add('perfect-visual-mode');
            setTimeout(() => {
              mainContainer.classList.remove('perfect-visual-mode');
            }, 5000);
          }, 100);
          return; 
        }

        tabItems.forEach(t => t.classList.remove('active'));
        item.classList.add('active');
        lastActiveTab = item; 
        
        if (contentData[target]) {
          titleElement.textContent = contentData[target].title;
          descElement.textContent = contentData[target].desc;
        }
      });
    });

    // 💡 2. 電腦版滑鼠拖拽捲動
    let isDown = false;
    let startY;
    let scrollTop;

    sidebar.addEventListener('mousedown', (e) => {
      isDown = true;
      sidebar.style.cursor = 'grabbing';
      startY = e.pageY - sidebar.offsetTop;
      scrollTop = sidebar.scrollTop;
    });

    sidebar.addEventListener('mouseleave', () => {
      isDown = false;
      sidebar.style.cursor = 'pointer';
    });

    sidebar.addEventListener('mouseup', () => {
      isDown = false;
      sidebar.style.cursor = 'pointer';
    });

    sidebar.addEventListener('mousemove', (e) => {
      if (!isDown) return; 
      e.preventDefault();   
      const y = e.pageY - sidebar.offsetTop;
      const walk = (y - startY) * 1.5; 
      sidebar.scrollTop = scrollTop - walk;
    });
  </script>

</body>
</html>
