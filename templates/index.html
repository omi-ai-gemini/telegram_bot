<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bot and user db api</title>
  <style>
    /* 全域與背景設定 */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('{{ url_for("static", filename="home_bg.png") }}?v=3');
      background-size: cover;
      background-position: center;
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    /* ✨ 中央模糊大卡片（幫你補回來了！） */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 60px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: white;
      margin: 0 0 40px 0; /* 移除內文多餘的 br，用 margin 控制與按鈕的完美距離 */
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    /* 按鈕群組的垂直排列與完美間距 */
    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px; /* 讓兩個按鈕之間有 20px 的漂亮空隙 */
    }

    /* ✨ 液態玻璃按鈕（文字置中 + 底部藍色霓虹發光） */
    .custom-button {
      display: block;
      text-align: center;
      width: 220px; /* 稍微加寬一點點，比例更優雅 */
      padding: 14px 20px;
      box-sizing: border-box;

      /* 按鈕本身的液態玻璃感 */
      background: rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;

      /* 結合頂部白光折射 + 你最愛的底部藍色霓虹發光 */
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 12px 24px rgba(37, 99, 235, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.15);

      /* 文字美化 */
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);

      /* 動態過渡效果 */
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, background 0.3s;
    }

    /* 滑鼠懸停 Hover 效果 */
    .custom-button:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.45);

      /* 懸停時藍色霓虹光芒擴散放大 */
      box-shadow: 
        inset 0 1px 3px rgba(255, 255, 255, 0.5),
        0 18px 36px rgba(37, 99, 235, 0.65),
        0 6px 16px rgba(0, 0, 0, 0.2);
    }
    
    /* 💡 核心切換與排版優化 */
    #developer-page {
      display: none;
    }

    /* 當點擊按鈕跳到吐槽頁面時 */
    #developer-page:target {
      display: flex;
    }

    /* 隱藏主網頁 */
    body:has(#developer-page:target) #main-page {
      display: none;
    }

    /* 1. 把吐槽頁面的 p 文字改大一點 */
    #developer-page p {
      font-size: 1.8rem !important; /* 從 1.2rem 放大到 1.8rem，超有感吐槽 */
      font-weight: bold;
    }

    /* 2. 讓返回主頁的按鈕在卡片裡完美居中 */
    #developer-page .glass-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* ================= 🎇 3秒霓虹煙火特效 ================= */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* 當點擊進入 developer-page 時，煙火動畫才觸換啟動 */
    #developer-page:target .firework {
      animation: explode 3s ease-out forwards; /* 剛好放3秒，播放完就消失 */
    }

    /* 三個煙火的不同爆炸位置與霓虹顏色 */
    .f1 { left: 30%; top: 40%; color: #3b82f6; box-shadow: 0 0 0 2px; }
    .f2 { left: 70%; top: 25%; color: #ec4899; animation-delay: 0.4s !important; }
    .f3 { left: 50%; top: 65%; color: #10b981; animation-delay: 0.2s !important; }

    /* 煙火爆炸成無數霓虹粒子的魔法數學公式 */
    @keyframes explode {
      0% {
        transform: translate(0, 100px) scale(1);
        opacity: 1;
        box-shadow: 0 0 0 2px currentColor;
      }
      30% {
        /* 升空到頂點準備爆炸 */
        transform: translate(0, 0) scale(1);
        opacity: 1;
        box-shadow: 0 0 0 4px currentColor;
      }
      60% {
        /* 四散炸開成無數個粒子點點，延續你原本的霓虹光芒 */
        opacity: 1;
        box-shadow: 
          -80px -80px 0 currentColor, 80px -80px 0 currentColor,
          -80px 80px 0 currentColor, 80px 80px 0 currentColor,
          0px -110px 0 currentColor, 0px 110px 0 currentColor,
          -110px 0px 0 currentColor, 110px 0px 0 currentColor,
          -50px -50px 0 2px currentColor, 50px -50px 0 2px currentColor,
          -50px 50px 0 2px currentColor, 50px 50px 0 2px currentColor;
      }
      100% {
        /* 3秒到！淡出消失 */
        transform: scale(1.5);
        opacity: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="container" id="main-page">
    <div class="glass-card">
    <h1>telemini<br/><br/></h1>
    <div class="button-group">
      <!--操作說明-->
      <a href="https://telegram-bot-vdrc.onrender.com/admin/manual" class="custom-button">使用說明</a>
      <br/>
      <!--你想得美-->
      <a href="#developer-page" class="custom-button">成為開發者</a>
      <br/>
      <!--後台登入-->
      <a href="https://telegram-bot-vdrc.onrender.com/admin/login" class="custom-button">開發者登入<br/></a>
    </div>
    </div>
  </div>
    <div class="container" id="developer-page">
      
    <div class="firework f1"></div>
    <div class="firework f2"></div>
    <div class="firework f3"></div>
      
    <div class="glass-card">
      <h1>成為開發者 🚀</h1>
      <p style="color: white; margin-bottom: 30px; font-size: 1.2rem;">
        你想得美哦<br/><br/><br/>
      </p>
      <a href="#main-page" class="custom-button">返回主頁</a>
    </div>
  </div>
</body>
</html>
