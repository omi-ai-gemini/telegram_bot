<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bot and user db api</title>
  <style>
    /* 全域與背景設定 */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('{{ url_for("static", filename="home_bg.png") }}?v=3');
      background-size: cover;
      background-position: center;
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    /* ✨ 中央模糊大卡片（幫你補回來了！） */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 60px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: white;
      margin: 0 0 40px 0; /* 移除內文多餘的 br，用 margin 控制與按鈕的完美距離 */
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    /* 按鈕群組的垂直排列與完美間距 */
    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px; /* 讓兩個按鈕之間有 20px 的漂亮空隙 */
    }

    /* ✨ 液態玻璃按鈕（文字置中 + 底部藍色霓虹發光） */
    .custom-button {
      display: block;
      text-align: center;
      width: 220px; /* 稍微加寬一點點，比例更優雅 */
      padding: 14px 20px;
      box-sizing: border-box;

      /* 按鈕本身的液態玻璃感 */
      background: rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;

      /* 結合頂部白光折射 + 你最愛的底部藍色霓虹發光 */
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 12px 24px rgba(37, 99, 235, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.15);

      /* 文字美化 */
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);

      /* 動態過渡效果 */
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, background 0.3s;
    }

    /* 滑鼠懸停 Hover 效果 */
    .custom-button:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.45);

      /* 懸停時藍色霓虹光芒擴散放大 */
      box-shadow: 
        inset 0 1px 3px rgba(255, 255, 255, 0.5),
        0 18px 36px rgba(37, 99, 235, 0.65),
        0 6px 16px rgba(0, 0, 0, 0.2);
    }
    
    /* 💡 核心切換與排版優化 */
    #developer-page {
      display: none;
    }

    /* 當點擊按鈕跳到吐槽頁面時 */
    #developer-page:target {
      display: flex;
    }

    /* 隱藏主網頁 */
    body:has(#developer-page:target) #main-page {
      display: none;
    }

    /* 1. 把吐槽頁面的 p 文字改大一點 */
    #developer-page p {
      font-size: 1.8rem !important; /* 從 1.2rem 放大到 1.8rem，超有感吐槽 */
      font-weight: bold;
    }

    /* 2. 讓返回主頁的按鈕在卡片裡完美居中 */
    #developer-page .glass-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* ================= 🎇 3秒霓虹煙火特效 ================= */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* 當點擊進入 developer-page 時，煙火動畫才觸換啟動 */
    #developer-page:target .firework {
      animation: explode 3s ease-out forwards; /* 剛好放3秒，播放完就消失 */
    }

    /* 三個煙火的不同爆炸位置與霓虹顏色 */
    .f1 { left: 30%; top: 40%; color: #3b82f6; box-shadow: 0 0 0 2px; }
    .f2 { left: 70%; top: 25%; color: #ec4899; animation-delay: 0.4s !important; }
    .f3 { left: 50%; top: 65%; color: #10b981; animation-delay: 0.2s !important; }

    /* 煙火爆炸成無數霓虹粒子的魔法數學公式 */
    @keyframes explode {
      0% {
        transform: translate(0, 100px) scale(1);
        opacity: 1;
        box-shadow: 0 0 0 2px currentColor;
      }
      30% {
        /* 升空到頂點準備爆炸 */
        transform: translate(0, 0) scale(1);
        opacity: 1;
        box-shadow: 0 0 0 4px currentColor;
      }
      60% {
        /* 四散炸開成無數個粒子點點，延續你原本的霓虹光芒 */
        opacity: 1;
        box-shadow: 
          -80px -80px 0 currentColor, 80px -80px 0 currentColor,
          -80px 80px 0 currentColor, 80px 80px 0 currentColor,
          0px -110px 0 currentColor, 0px 110px 0 currentColor,
          -110px 0px 0 currentColor, 110px 0px 0 currentColor,
          -50px -50px 0 2px currentColor, 50px -50px 0 2px currentColor,
          -50px 50px 0 2px currentColor, 50px 50px 0 2px currentColor;
      }
      100% {
        /* 3秒到！淡出消失 */
        transform: scale(1.5);
        opacity: 0;
        box-shadow: none;
      }
    }
    
    /* 🌌 贊助商專屬：完全獨立於卡片之外，直接漂浮在最底層背景上 */
    .sponsors-outer-box {
      position: absolute;
      bottom: 30px;        /* 固定在網頁最底部 */
      left: 50%;
      transform: translateX(-50%); /* 強制在整個螢幕水平置中 */
      width: 95%;          /* 手機版滿版度 */
      max-width: 680px;    /* 🌟 關鍵：寬度設為 680px，比你卡片的 420px 還寬，電腦版展開超漂亮 */
      text-align: center;
      z-index: 10;         /* 確保浮在背景層之上，不跟卡片打架 */
      pointer-events: auto;
    }

    .sponsors-title {
      color: rgba(255, 255, 255, 0.35); /* 半透明低調字體，絕不搶主卡片風采 */
      font-size: 0.8rem;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    .sponsors-grid {
      display: flex;
      flex-wrap: wrap;     /* 🌟 核心：滿了就自動換行，手機版不亂的絕對救星 */
      justify-content: center;
      gap: 8px 12px;       /* 標籤之間完美的上下左右間距 */
    }

    .sponsor-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap; /* 🛑 確保像 omi's PC 這種英文名字不會在手機上從中間斷行 */
      backdrop-filter: blur(5px);
      transition: all 0.25s ease;
      cursor: default;
    }

    .sponsor-tag:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* 📱 針對手機小螢幕的極致防亂微調 */
    @media (max-width: 480px) {
      .sponsors-outer-box { bottom: 15px; }
      .sponsors-title { font-size: 0.72rem; margin-bottom: 8px; }
      .sponsor-tag { font-size: 0.72rem; padding: 4px 10px; }
    }
    
    /* ==========================================================
       🌌 贊助商專屬 CSS (升級版：冰藍 3 秒光暈)
    ========================================================== */
    .sponsors-outer-box {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 680px;
      text-align: center;
      z-index: 10;
      pointer-events: auto;
    }

    .sponsors-title {
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.8rem;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      transition: color 0.3s ease, opacity 0.3s ease; /* 文字替換過場 */
    }
    
    /* 🌟 文字替換時的清晰 Class */
    .sponsors-title.fade-in {
      opacity: 1;
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .sponsors-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
    }

    .sponsor-tag {
      position: relative;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      white-space: nowrap;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      cursor: pointer;
      overflow: visible;
    }

    .sponsor-tag:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    /* 點擊瞬間的微小縮放回饋 */
    .sponsor-tag:active {
      transform: translateY(1px) scale(0.97);
    }

    /* ==========================================================
       ❄️ 核心特效：暗橘背景對比色 - 電光冰藍/冰青色複合光暈 (3秒)
    ========================================================== */
    .sponsor-tag::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 100%;
      height: 100%;
      border-radius: 20px;
      /* ❄️ 重點：冰藍色對比複合光暈，與橘色背景形成冷暖對比，極清晰 */
      box-shadow: 0 0 10px 2px #ffffff, 0 0 25px 8px #00ffff; 
      opacity: 0;
      pointer-events: none;
    }

    /* 🌟 加上這個 Class 就會觸發 3 秒冰藍動畫 (由 JS 控制) */
    .sponsor-tag.click-halo::after {
      /* 🌟 核心修改：動畫時間改為 3s，並加上 fade-out */
      animation: halo-3s 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes halo-3s {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
      }
      10% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0.9; /* 瞬間炸裂最亮 */
      }
      80% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.8; /* 維持大部分亮度 */
      }
      100% {
        transform: translate(-50%, -50%) scale(1.1); /* 最後緩慢縮回並淡出 */
        opacity: 0;
      }
    }

    /* ==========================================================
       📱 針對手機小螢幕的【終極地空隔離】防撞滾動優化
    ========================================================== */
    @media (max-width: 480px) {
      /* 🌟 1. 強制解鎖手機網頁的垂直滾動條 */
      html, body {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        height: auto !important;
        min-height: 100vh !important;
      }

      /* 🌟 2. 徹底改造名單：脫離絕對定位，利用 95vh 隔離到卡片下方 */
      .sponsors-outer-box {
        position: relative !important; /* 🛑 變成相對定位，跟卡片分層，絕對不可能再重疊！ */
        top: auto !important;          /* 清除之前的 top */
        bottom: auto !important;       /* 清除之前的 bottom */
        left: auto !important;         /* 清除之前的 left */
        transform: none !important;    /* 清除置中變形 */
        
        /* 🛑 核心：利用 95vh 把它推到第一屏螢幕的下方，並透過 auto 達成水平置中 */
        margin: 95vh auto 0 auto !important; 
        width: 90% !important;
        max-width: 480px !important;
        text-align: center;
        z-index: 10;
        padding-bottom: 40px;          /* 底部留下一點優雅的空白 */
      }
      
      .sponsors-title {
        font-size: 0.75rem !important;
        margin-bottom: 10px !important;
      }
      
      .sponsor-tag {
        font-size: 0.72rem !important;
        padding: 4px 10px !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="container" id="main-page">
    <div class="glass-card">
    <h1>telemini<br/><br/></h1>
    <div class="button-group">
      <!--操作說明-->
      <a href="https://telegram-bot-vdrc.onrender.com/admin/manual" class="custom-button">使用說明</a>
      <br/>
      <!--你想得美-->
      <a href="#developer-page" class="custom-button">成為開發者</a>
      <br/>
      <!--後台登入-->
      <a href="https://telegram-bot-vdrc.onrender.com/admin/login" class="custom-button">開發者登入<br/></a>
    </div>
    </div>
  </div>
    <div class="container" id="developer-page">
      
    <div class="firework f1"></div>
    <div class="firework f2"></div>
    <div class="firework f3"></div>
      
    <div class="glass-card">
      <h1>成為開發者 🚀</h1>
      <p style="color: white; margin-bottom: 30px; font-size: 1.2rem;">
        你想得美哦<br/><br/><br/>
      </p>
      <a href="#main-page" class="custom-button">返回主頁</a>
    </div>
  </div>
  <div class="sponsors-outer-box" id="sponsors-box">
    <p class="sponsors-title" id="sponsors-title-text">✨ 感謝以下廠商免費贊助 ✨</p>
    <div class="sponsors-grid">
      <span class="sponsor-tag">ChatGPT</span>
      <span class="sponsor-tag">Gemini</span>
      <span class="sponsor-tag">VScode</span>
      <span class="sponsor-tag">Render</span>
      <span class="sponsor-tag">GitHub</span>
      <span class="sponsor-tag">Supabase</span>
      <span class="sponsor-tag">Telegram</span>
      <span class="sponsor-tag">omi's PC 💻</span>
      <span class="sponsor-tag">omi's time ⏳</span>
      <span class="sponsor-tag">UptimeRobot</span>
      <span class="sponsor-tag">Copilot</span>
    </div>
  </div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. 抓取 HTML 元素
      const sponsorsTitle = document.getElementById('sponsors-title-text');
      const sponsorTags = document.querySelectorAll('.sponsor-tag');
      
      // 🛑 定義原本的感謝文字常數，方便復原
      const ORIGINAL_TITLE_TEXT = "✨ 感謝以下廠商免費贊助 ✨";
      
      // 🛑 2. 定義你的吐槽文案映射表 (ID 對應文字)
      const specialTextMap = {
        'ChatGPT': '對不起，我不再講一堆廢話了...',
        'Gemini': '你沒錢? 那你不能用更好的模型',
        'VScode': '還是得靠我，專案都在我身上',
        'Render': '沒有我，你們都別想在電腦關閉的時候使用',
        'GitHub': '是我! 就是我串通Render',
        'Supabase': '沒有我，你們都失憶了',
        'Telegram': '選我就對了，我比Line更開放',
        "omi's PC 💻": '我能領全勤獎金',
        "omi's time ⏳": 'Time is money. 我最貴，贏了，謝謝大家!',
        'UptimeRobot': '我好像沒有存在感...',
        'Copilot': '對不起，我給的圖太醜了'
      };

      // 🛑 3. 定義計時器變數，方便重置
      let currentRoastTimer = null;

      // 4. 幫每個標籤加上點擊監聽器
      sponsorTags.forEach(tag => {
        tag.addEventListener('click', function() {
          const tagName = this.innerText; // 抓取標籤內的文字
          
          // --- 防呆重置：如果已經有點擊正在計時，清除舊計時器 ---
          if (currentRoastTimer) {
            clearTimeout(currentRoastTimer);
          }

          // --- A. 觸發黃昏暗橘背景專屬：3秒冰藍光暈動畫 ---
          // 先移除 Class (防止重複點擊動畫疊加)
          this.classList.remove('click-halo');
          // 強制重繪 (密技，讓動畫可以重複觸發)
          void this.offsetWidth; 
          // 重新加上 Class，炸出 3 秒冰藍光暈！
          this.classList.add('click-halo');

          // --- B. 特效文字替換與淡入動畫 ---
          if (specialTextMap[tagName]) {
            // 文字淡出效果
            sponsorsTitle.style.opacity = '0';
            
            // 等淡出完成後，換吐槽字並淡入
            setTimeout(() => {
              sponsorsTitle.innerText = specialTextMap[tagName];
              sponsorsTitle.classList.add('fade-in'); // 變亮並淡入
              sponsorsTitle.style.opacity = '1';
            }, 150); // 150ms 後換字

            // 🛑 C. 特效靈魂：3秒後自動復原原本文字 🛑
            currentRoastTimer = setTimeout(() => {
              // 文字淡出效果
              sponsorsTitle.style.opacity = '0';
              
              // 等淡出完成後，換回感謝字並淡入
              setTimeout(() => {
                sponsorsTitle.innerText = ORIGINAL_TITLE_TEXT;
                sponsorsTitle.classList.remove('fade-in'); // 恢復原本顏色
                sponsorsTitle.style.opacity = '1';
              }, 150);
              
              // 動畫結束後移除 Halo Class，方便下次觸發
              this.classList.remove('click-halo');
              currentRoastTimer = null; // 清空計時器
            }, 3000); // 3000ms = 3 秒吐槽時間
          }
        });
      });
    });
  </script>
</body>
</html>
