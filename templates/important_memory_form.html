<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重點記憶</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }
    .page { width: 100%; max-width: 720px; margin: 0 auto; }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 8px 0; font-size: 26px; }
    .desc {
      margin: 0 0 20px 0;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.72);
    }
    .note, .warn {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .note {
      color: #bfdbfe;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
    }
    .warn {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
    }
    .section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .section-title {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.86);
    }
    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.6;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.8);
      outline: none;
    }
    textarea:focus {
      border-color: rgba(96, 165, 250, 0.9);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16);
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-btn {
      width: 100%;
      margin-top: 14px;
      color: #0f172a;
      background: #93c5fd;
    }
    .row-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .save-btn {
      flex: 1;
      color: #052e16;
      background: #86efac;
    }
    .delete-btn {
      flex: 1;
      color: #450a0a;
      background: #fca5a5;
    }
    .memory-item {
      margin-top: 12px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .memory-meta {
      margin-bottom: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.48);
    }
    .empty {
      padding: 14px;
      border-radius: 14px;
      color: rgba(255, 255, 255, 0.62);
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.14);
    }
    #result {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .ok { color: #bbf7d0; }
    .error { color: #fecaca; }

    .setting-auth-box {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #bfdbfe;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
    }
    .setting-auth-box.warning {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.28);
    }
    .setting-auth-box.expired {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.28);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>⭐ 重點記憶</h1>
      <p class="desc">重點記憶會比一般長期摘要更優先，被視為穩定設定或重要事實。</p>

      {% if is_group %}
      <div class="warn">群組重點記憶欄位已預留，但目前暫不開放群組寫入或管理。</div>
      {% else %}
      <div class="note">適合寫：角色關係、使用者偏好、重要設定、長期不應忘記的事。下方可以查看、修改或單筆刪除目前保存的重點記憶。</div>

      <div id="setting-auth-box" class="setting-auth-box" data-expires-at="{{ token_expires_at }}">
        請在時效內按儲存。剩餘時間：<span id="setting-countdown">15:00</span>
      </div>

      <form id="memoryForm">
        <input type="hidden" name="bot_id" value="{{ bot_id }}">
        <input type="hidden" name="chat_id" value="{{ chat_id }}">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <input type="hidden" name="token" value="{{ token }}">

        <label for="important_memory">新增重點記憶</label>
        <textarea id="important_memory" name="important_memory" placeholder="例如：使用者偏好直接、可執行的程式碼修正，不喜歡冗長解釋。"></textarea>

        <button id="submit-btn" class="primary-btn" type="submit">儲存重點記憶</button>
      </form>

      <div class="section">
        <div class="section-title">已保存的重點記憶</div>
        <div id="memoryList" class="empty">讀取中...</div>
      </div>
      {% endif %}

      <div id="result"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('memoryForm');
    const result = document.getElementById('result');
    const memoryList = document.getElementById('memoryList');

    const submitBtn = document.getElementById('submit-btn');
    const settingAuthBox = document.getElementById('setting-auth-box');
    const settingCountdown = document.getElementById('setting-countdown');
    const settingExpiresAt = Number(settingAuthBox?.dataset?.expiresAt || 0) * 1000;
    const settingToken = "{{ token }}";
    let settingLinkExpired = false;

    function formatSettingTime(totalSeconds) {
      const safeSeconds = Math.max(0, totalSeconds);
      const minutes = String(Math.floor(safeSeconds / 60)).padStart(2, '0');
      const seconds = String(safeSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function setSettingExpired() {
      settingLinkExpired = true;

      if (settingAuthBox) {
        settingAuthBox.className = 'setting-auth-box expired';
        settingAuthBox.innerHTML = '設定連結已失效，請回 Telegram 重新開啟設定。';
      }

      document.querySelectorAll('button').forEach((button) => {
        button.disabled = true;
      });

      if (submitBtn) {
        submitBtn.textContent = '連結已失效';
      }
    }

    function updateSettingCountdown() {
      if (!settingExpiresAt || !settingCountdown || !settingAuthBox) return;

      const remaining = Math.floor((settingExpiresAt - Date.now()) / 1000);

      if (remaining <= 0) {
        setSettingExpired();
        return;
      }

      settingCountdown.textContent = formatSettingTime(remaining);

      if (remaining <= 180) {
        settingAuthBox.className = 'setting-auth-box warning';
        settingAuthBox.innerHTML = `連結即將失效，請盡快儲存。剩餘時間：<span id="setting-countdown">${formatSettingTime(remaining)}</span>`;
      }
    }

    updateSettingCountdown();
    setInterval(updateSettingCountdown, 1000);

    const botId = "{{ bot_id }}";
    const chatId = "{{ chat_id }}";
    const userId = "{{ user_id }}";

    function setResult(message, ok = true) {
      result.className = ok ? 'ok' : 'error';
      result.textContent = message;
    }

    function escapeHTML(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function buildFormData(memoryId, text) {
      const data = new FormData();
      data.append('bot_id', botId);
      data.append('chat_id', chatId);
      data.append('user_id', userId);
      data.append('token', settingToken);
      data.append('memory_id', memoryId);
      data.append('important_memory', text || '');
      return data;
    }

    async function loadMemories() {
      if (!memoryList) return;

      memoryList.className = 'empty';
      memoryList.textContent = '讀取中...';

      try {
        const params = new URLSearchParams({ bot_id: botId, chat_id: chatId, user_id: userId, token: settingToken });
        const res = await fetch('/setting/important_memory/list?' + params.toString());
        const data = await res.json();

        if (!res.ok || !data.ok) {
          memoryList.textContent = data.message || '讀取失敗';
          return;
        }

        const memories = data.memories || [];

        if (!memories.length) {
          memoryList.className = 'empty';
          memoryList.textContent = '目前沒有重點記憶。';
          return;
        }

        memoryList.className = '';
        memoryList.innerHTML = memories.map((item) => `
          <div class="memory-item" data-id="${item.id}">
            <div class="memory-meta">#${item.id}　更新：${escapeHTML(item.updated_at || '')}</div>
            <textarea class="memory-text">${escapeHTML(item.fact)}</textarea>
            <div class="row-actions">
              <button type="button" class="save-btn" data-action="update" data-id="${item.id}">修改</button>
              <button type="button" class="delete-btn" data-action="delete" data-id="${item.id}">刪除</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        memoryList.className = 'empty';
        memoryList.textContent = '讀取失敗：' + err;
      }
    }

    if (form) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (settingLinkExpired) {
          setResult('設定連結已失效，請回 Telegram 重新開啟設定。', false);
          return;
        }

        setResult('儲存中...');

        const formData = new FormData(form);

        try {
          const res = await fetch('/setting/important_memory/save', {
            method: 'POST',
            body: formData
          });

          const data = await res.json();
          setResult(data.message || (data.ok ? '已儲存' : '儲存失敗'), res.ok && data.ok);

          if (res.ok && data.ok) {
            form.reset();
            await loadMemories();
          }
        } catch (err) {
          setResult('儲存失敗：' + err, false);
        }
      });
    }

    if (memoryList) {
      memoryList.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        if (settingLinkExpired) {
          setResult('設定連結已失效，請回 Telegram 重新開啟設定。', false);
          return;
        }

        const memoryId = button.dataset.id;
        const item = button.closest('.memory-item');
        const textarea = item.querySelector('.memory-text');
        const action = button.dataset.action;

        if (action === 'delete') {
          if (!confirm('確定刪除這筆重點記憶？')) return;

          const data = buildFormData(memoryId, textarea.value);

          try {
            const res = await fetch('/setting/important_memory/delete', {
              method: 'POST',
              body: data
            });
            const body = await res.json();
            setResult(body.message || '已刪除', res.ok && body.ok);
            await loadMemories();
          } catch (err) {
            setResult('刪除失敗：' + err, false);
          }

          return;
        }

        if (action === 'update') {
          const data = buildFormData(memoryId, textarea.value.trim());

          try {
            const res = await fetch('/setting/important_memory/update', {
              method: 'POST',
              body: data
            });
            const body = await res.json();
            setResult(body.message || '已修改', res.ok && body.ok);
            await loadMemories();
          } catch (err) {
            setResult('修改失敗：' + err, false);
          }
        }
      });
    }

    loadMemories();
  </script>
</body>
</html>
