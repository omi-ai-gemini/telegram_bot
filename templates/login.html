<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開發者控制台 - 登入</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全域與背景設定
       ========================================== */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1220; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 科技感背景層 */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('{{ url_for("static", filename="login_bg.png") }}?v=3');
      background-size: cover;
      background-position: center;
      filter: brightness(0.6) blur(2px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* ==========================================
       2. 液態玻璃卡片主體
       ========================================== */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .login-header {
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       3. 表單輸入框 (微液態半透明感)
       ========================================== */
    .input-group {
      text-align: left;
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 8px;
      margin-left: 4px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    /* 輸入框聚焦時的發光反饋 */
    .input-group input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(37, 99, 235, 0.5);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.25);
    }

    /* ==========================================
       4. 液態玻璃發光按鈕 (完美置中 + 霓虹藍光)
       ========================================== */
    .login-btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 12px 24px rgba(37, 99, 235, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, background 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 
        inset 0 1px 3px rgba(255, 255, 255, 0.5),
        0 18px 36px rgba(37, 99, 235, 0.55),
        0 6px 16px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       5. 頁尾裝飾連結
       ========================================== */
    .footer-links {
      margin-top: 35px;
      font-size: 14px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    .footer-links span {
      color: rgba(255, 255, 255, 0.15);
      margin: 0 10px;
    }

    /* 🧠 吐槽文字的樣式 */
    .egg-message {
      color: #ef4444; /* 醒目的警告紅 */
      font-size: 13px;
      margin-top: 15px;
      font-weight: bold;
      display: none; /* 預設先隱藏起來 */
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

        @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
    }
    
    .shake-error {
        animation: shake 0.5s ease-in-out;
    }
    
    .shake-error input {
        border-color: #ff4444 !important;
        box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
    }

  </style>
</head>
<body>

  <div class="bg-layer"></div>

  <div class="container">
    <div class="glass-card">
      <div class="login-header">開發者登入</div>
      
      <form action="https://telemini-jc31.onrender.com/admin/login" method="POST">
        
        <div class="input-group">
          <label for="password">請輸入安全金鑰 (Password)</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="login-btn">後台登入</button>
        
      </form> <div class="footer-links">
        <a href="javascript:void(0);" id="forget-link">忘記金鑰？</a>
        <span>|</span>
        <a href="https://telemini-jc31.onrender.com/admin">返回首頁</a>
      </div>

      <div id="egg-box" class="egg-message">忘記金鑰?你要先成為開發者</div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. 處理彩蛋點擊
      const forgetLink = document.getElementById('forget-link');
      const eggBox = document.getElementById('egg-box');
      
      if (forgetLink && eggBox) {
        forgetLink.addEventListener('click', function(e) {
          e.preventDefault(); // 防止網頁跳轉
          // 切換顯示狀態：如果隱藏就顯示，如果顯示就隱藏
          eggBox.style.display = (eggBox.style.display === 'block') ? 'none' : 'block';
        });
      }

    // 🛡️ 我們的登入安全攔截與特效
    const form = document.querySelector("form");
    const passwordInput = document.querySelector("input[name='password']");
    const shakeTarget = document.querySelector(".input-group"); // 你想要震動的區塊

    if (form && passwordInput) {
      form.addEventListener("submit", async (e) => {
        e.preventDefault(); 
        const password = passwordInput.value;
        if (!password) return;

        try {
          const response = await fetch("https://telemini-jc31.onrender.com/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ "password": password }),
            credentials: "include" 
          });

          const text = await response.text();

          if (text.includes("密碼錯誤")) {
            // ❌ 錯誤：清空密碼＋震動發紅光！
            passwordInput.value = "";
            if(shakeTarget) {
                shakeTarget.classList.add("shake-error");
                setTimeout(() => {
                  shakeTarget.classList.remove("shake-error");
                }, 500);
            }
          } else {
            // 🎉 成功：順利進入後台！
            window.location.href = "https://telemini-jc31.onrender.com/admin/login/developer";
          }
        } catch (error) {
          console.error("連線錯誤：", error);
          alert("無法連線至安全伺服器！");
        }
      });
    }
  });
  </script>

</body>
</html>
