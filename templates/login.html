<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開發者控制台 - 登入</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全域與背景設定
       ========================================== */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
      /* 基礎背景色，防止圖片沒載入時一片白 */
      background: #0b1220; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ✨ 補上的科技感背景圖層 */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      /* 這邊用一個示例網址，您可以換成您喜歡的科技感背景圖 */
      background-image: url('{{ url_for("static", filename="login_bg.png") }}?v=3');
      background-size: cover;
      background-position: center;
      /* 將圖片壓暗，並設定一點點模糊，讓卡片更突出 */
      filter: brightness(0.6) blur(2px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* ==========================================
       2. 液態玻璃卡片主體
       ========================================== */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .login-header {
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       3. 表單輸入框 (微液態半透明感)
       ========================================== */
    .input-group {
      text-align: left;
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 8px;
      margin-left: 4px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    /* 輸入框聚焦時的發光反饋 */
    .input-group input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(37, 99, 235, 0.5);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.25);
    }

    /* ==========================================
       4. 液態玻璃發光按鈕 (完美置中 + 霓虹藍光)
       ========================================== */
    .login-btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      
      /* 頂部白光折射 + 底部經典藍色霓虹發光 */
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 12px 24px rgba(37, 99, 235, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.15);
      
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, background 0.3s;
    }

    /* 按鈕滑鼠懸停效果 */
    .login-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 
        inset 0 1px 3px rgba(255, 255, 255, 0.5),
        0 18px 36px rgba(37, 99, 235, 0.55),
        0 6px 16px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       5. 頁尾裝飾連結
       ========================================== */
    .footer-links {
      margin-top: 35px;
      font-size: 14px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    .footer-links span {
      color: rgba(255, 255, 255, 0.15);
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>

  <div class="container">
    <div class="glass-card">
      <div class="login-header">開發者登入</div>
      
      <form action="https://telegram-bot-vdrc.onrender.com/admin/login" method="POST">
        
        <div class="input-group">
          <label for="username">開發者帳號</label>
          <input type="text" id="username" name="username" placeholder="請輸入帳號" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <label for="password">安全密碼</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="login-btn">進入後台管理</button>
        
      </form>
      
      <div class="footer-links">
        <a href="#">忘記密碼？</a>
        <span>|</span>
        <a href="https://telegram-bot-vdrc.onrender.com/admin">返回首頁</a>
      </div>
    </div>
  </div>

</body>
</html>
